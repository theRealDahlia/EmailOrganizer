# /etc/nginx/conf.d/sweepmail.conf on the Lightsail instance.
# Certbot adds the HTTPS server block: sudo certbot --nginx -d www.sweepmail.org -d sweepmail.org
server {
    listen 80;
    listen [::]:80;
    server_name sweepmail.org;
    return 301 https://www.sweepmail.org$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.sweepmail.org;

    root /var/www/sweepmail;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Browsers check for a newer stylesheet or script on every visit (a quick "not modified" when nothing changed),
    # so a deploy shows up straight away instead of mixing a new page with an old cached stylesheet.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(png|svg|ico|woff2)$ {
        expires 7d;
    }
}
